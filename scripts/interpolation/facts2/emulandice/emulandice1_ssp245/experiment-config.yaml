      "parameters/solar_erf_timebounds.csv"  # filename from module defaults
  options:
    # Options inherited from top-level metadata: pipeline-id, nsamps, scenario, pyear-start, pyear-end
    reference-year:
      # Reference year for RCMIP data
      1750  # user specified value
    cyear-start:
      # Start year of temporal range for centering
      1850  # user specified value
    cyear-end:
      # End year of temporal range for centering
      1900  # user specified value
    smooth-win:
      # Number of years to use as a smoothing window
      19  # user specified value
    seed:
      # Seed for the random number generator.
      1234  # user specified value
  image: "ghcr.io/fact-sealevel/fair2-climate:0.1.0"
  outputs:
    output-climate-file:
      value: "fair2-climate/climate.nc"
      output_type: global
    output-gsat-file:
      value: "fair2-climate/gsat.nc"
      output_type: global
    output-oceantemp-file:
      value: "fair2-climate/ocean_temp.nc"
      output_type: global
    output-ohc-file:
      value: "fair2-climate/ohc.nc"
      output_type: global
