##----- Module-specific inputs, options, and outputs -----##
fair2-climate:
  inputs:
    rcmip-concentration-file:
      # Path to RCMIP concentrations file
      "rcmip/rcmip-concentrations-annual-means-v5-1-0.csv"  # filename from module defaults
    rcmip-emissions-file:
      # Path to RCMIP emissions file
      "rcmip/rcmip-emissions-annual-means-v5-1-0.csv"  # filename from module defaults
    rcmip-forcing-file:
      # Path to RCMIP radiative forcing file
      "rcmip/rcmip-radiative-forcing-annual-means-v5-1-0.csv"  # filename from module defaults
    calibration-file:
      # Path to calibrated constrained parameters file
      "parameters/calibrated_constrained_parameters.csv"  # filename from module defaults
    species-config-file:
      # Path to species configuration properties file
      "parameters/species_configs_properties_calibration1.2.0.csv"  # filename from module defaults
    volcanic-erf:
      # Path to volcanic ERF timebounds file
      "parameters/volcanic_ERF_1750-2101_timebounds.csv"  # filename from module defaults
    solar-erf:
