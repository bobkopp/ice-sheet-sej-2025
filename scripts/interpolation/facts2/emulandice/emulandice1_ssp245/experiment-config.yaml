    output-gslr-wais-file:
      value: "emulandice-ais/output-gslr-wais.nc"
      output_type: global
    output-gslr-eais-file:
      value: "emulandice-ais/output-gslr-eais.nc"
      output_type: global
    output-gslr-pen-file:
      value: "emulandice-ais/output-gslr-pen.nc"
      output_type: global
    output-lslr-file:
      value: "emulandice-ais/output-lslr.nc"
      output_type: local
    output-lslr-eais-file:
      value: "emulandice-ais/output-lslr-eais.nc"
      output_type: local
    output-lslr-wais-file:
      value: "emulandice-ais/output-lslr-wais.nc"
